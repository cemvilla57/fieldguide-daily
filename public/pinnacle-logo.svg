<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <!--
    Pinnacle Power Corp logo
    Mountain silhouette: gold (#C4922A), detailed with shadow ridgelines
    "PINNACLE": large black bold serif
    "POWER CORP": smaller spaced gold serif
  -->

  <!-- Mountain body — single connected gold silhouette -->
  <!-- The shape: left foothills rise, main peak center-left, secondary peak right, right foothills -->
  <polygon
    points="
      30,145
      70,115
      90,125
      115,88
      125,98
      160,50
      185,78
      200,30
      225,72
      245,58
      275,85
      295,68
      330,105
      355,90
      390,118
      410,108
      440,130
      460,145
      460,148
      30,148
    "
    fill="#C4922A"
  />

  <!-- Shadow / ridge detail on main peak (darker overlay to give depth) -->
  <!-- Left face of main peak — lighter highlight -->
  <polygon
    points="200,30 160,50 185,78 225,72"
    fill="#D4A840"
    opacity="0.5"
  />
  <!-- Shadow on right ridge of main peak -->
  <polygon
    points="200,30 225,72 245,58 275,85 295,68 260,110 200,148"
    fill="#A07020"
    opacity="0.35"
  />
  <!-- Shadow on secondary right peak -->
  <polygon
    points="295,68 330,105 355,90 380,118 350,148 295,148"
    fill="#A07020"
    opacity="0.25"
  />

  <!-- PINNACLE — bold black serif, large -->
  <text
    x="250"
    y="218"
    font-family="'Times New Roman', Georgia, serif"
    font-size="88"
    font-weight="900"
    font-style="normal"
    fill="#111111"
    text-anchor="middle"
    letter-spacing="1"
  >PINNACLE</text>

  <!-- POWER CORP — gold, spaced, smaller -->
  <text
    x="250"
    y="258"
    font-family="'Times New Roman', Georgia, serif"
    font-size="30"
    font-weight="700"
    fill="#C4922A"
    text-anchor="middle"
    letter-spacing="10"
  >POWER CORP</text>
</svg>
