<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300">
  <!--
    Pinnacle Power Corp logo — faithful SVG recreation
    Mountain: two-peak silhouette, lighter left face / darker right face
    Text: "PINNACLE" large bold black serif + "POWER CORP" gold spaced
  -->

  <!-- === MOUNTAIN SILHOUETTE === -->

  <!-- Left illuminated face of main (left) peak -->
  <polygon
    points="
      60,155
      120,120
      140,130
      175,90
      200,105
      230,55
      255,85
      250,155
    "
    fill="#D4A030"
  />

  <!-- Right shadow face of main (left) peak -->
  <polygon
    points="
      230,55
      255,85
      260,155
      360,155
      355,130
      325,118
      305,100
      280,88
    "
    fill="#A07018"
  />

  <!-- Secondary (right) peak — illuminated left face -->
  <polygon
    points="
      280,88
      305,100
      325,118
      345,108
      370,125
      390,115
      420,138
      440,155
      360,155
    "
    fill="#C4921E"
  />

  <!-- Left foothill -->
  <polygon
    points="
      30,155
      60,155
      120,120
      140,130
      175,90
      155,105
      110,118
      80,130
    "
    fill="#C4921E"
  />

  <!-- Baseline bar -->
  <rect x="30" y="150" width="460" height="6" fill="#A07018" />

  <!-- === TYPOGRAPHY === -->

  <!-- "PINNACLE" — extra-bold black serif, initial "P" slightly taller -->
  <!-- Using a single text element; the large-P effect comes from the condensed serif weight -->
  <text
    x="260"
    y="234"
    font-family="'Times New Roman', Georgia, 'Palatino Linotype', serif"
    font-size="96"
    font-weight="900"
    fill="#111111"
    text-anchor="middle"
    letter-spacing="-1"
  >PINNACLE</text>

  <!-- "POWER CORP" — gold, widely spaced, smaller bold serif -->
  <text
    x="260"
    y="275"
    font-family="'Times New Roman', Georgia, 'Palatino Linotype', serif"
    font-size="32"
    font-weight="700"
    fill="#C4921E"
    text-anchor="middle"
    letter-spacing="12"
  >POWER CORP</text>
</svg>
