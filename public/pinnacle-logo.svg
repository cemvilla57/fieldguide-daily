<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <!-- Mountain silhouette in gold -->
  <g fill="#C9973A">
    <!-- Far-left small peak -->
    <polygon points="20,140 60,80 100,130" />
    <!-- Left peak -->
    <polygon points="55,140 110,55 170,140" />
    <!-- Center main peak (tallest) -->
    <polygon points="130,140 210,15 290,140" />
    <!-- Right peak -->
    <polygon points="240,140 300,60 360,140" />
    <!-- Far-right small peak -->
    <polygon points="310,140 345,90 380,140" />
    <!-- Base fill to connect peaks -->
    <rect x="20" y="130" width="360" height="12" />
  </g>

  <!-- PINNACLE in bold black -->
  <text
    x="200"
    y="185"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="68"
    font-weight="900"
    fill="#1a1a1a"
    text-anchor="middle"
    letter-spacing="2"
  >PINNACLE</text>

  <!-- POWER CORP in gold -->
  <text
    x="200"
    y="215"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="700"
    fill="#C9973A"
    text-anchor="middle"
    letter-spacing="8"
  >POWER CORP</text>
</svg>
