<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FieldGuide Daily</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08151a; color: #f4fbf8; }
      main { width: min(680px, calc(100% - 48px)); padding: 56px; border: 1px solid #285a56; border-radius: 24px; background: linear-gradient(145deg, #102b2b, #0b1e24); box-shadow: 0 24px 80px #0008; }
      p { color: #bed2ce; font-size: 1.15rem; line-height: 1.6; }
      .eyebrow { color: #6ee7c8; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .78rem; }
      h1 { margin: 12px 0; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Pinnacle Operations</div>
      <h1>FieldGuide Daily</h1>
      <p>Capture field updates, photos, and reports in one place. The operations workspace is being prepared for your team.</p>
    </main>
  </body>
</html>
